<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0C0A" />

    <title>Akhari — Your AI Partner</title>
    <meta
      name="description"
      content="An AI partner for businesses in Hyderabad — not a one-off automation vendor. We find where automation earns its place, fit it to how you already work, and stay on to run it: voice agents, live dashboards, workflow and API automation."
    />

    <!--
      SOCIAL PREVIEWS
      =========================================================================
      These URLs are absolute on purpose. WhatsApp, LinkedIn and Facebook all
      ignore a relative og:image and fall back to a bare text card — and given
      how much of this business arrives as a link pasted into WhatsApp, that
      preview is doing real work.

      The canonical host is akhari.in. If it ever changes, update the four
      absolute URLs here (og:image, og:url, twitter:image, canonical), the
      Sitemap line in robots.txt, public/sitemap.xml, and the Site reference
      in pages/Privacy.tsx.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akhari" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Akhari — Your AI Partner" />
    <meta
      property="og:description"
      content="Build systems, not repetitive tasks. The AI partner a business keeps on — automation, voice agents and live dashboards for businesses in Hyderabad."
    />
    <meta property="og:image" content="https://akhari.in/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Akhari — build systems, not repetitive tasks." />
    <meta property="og:url" content="https://akhari.in/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akhari — Your AI Partner" />
    <meta
      name="twitter:description"
      content="Build systems, not repetitive tasks. The AI partner a business keeps on — automation, voice agents and live dashboards for businesses in Hyderabad."
    />
    <meta name="twitter:image" content="https://akhari.in/brand/og.png" />

    <link rel="canonical" href="https://akhari.in/" />

    <!--
      LOCAL SEO
      =========================================================================
      Structured data for a small business search — "automation company
      Hyderabad" is exactly the query a small-business owner actually types,
      and without this the site is just prose to a crawler. Update alongside
      brand.ts if the founders, contact details or location ever change.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Akhari",
        "description": "AI automation partner for small businesses in Hyderabad — workflow automation, AI agents, voice agents and API integrations.",
        "url": "https://akhari.in/",
        "email": "info@akhari.in",
        "telephone": "+91-80089-84976",
        "areaServed": "Hyderabad, India",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "founder": [
          { "@type": "Person", "name": "Akhil Madhav" },
          { "@type": "Person", "name": "Hari Prasad" }
        ]
      }
    </script>

    <link rel="icon" href="/brand/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/logo-mark-sm.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Instrument Serif is display-only: headlines and nothing else. It ships a
      single weight, which is the point — it is a face for large sizes, not a
      family to set a page in. Inter still carries body copy and JetBrains Mono
      the technical labels.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
