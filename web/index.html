<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0C0A" />

    <title>Akhari — AI Automation Studio</title>
    <meta
      name="description"
      content="AI automation for businesses in Hyderabad: voice agents, live dashboards, workflow and API automation. Built by one person, and kept running after they ship."
    />

    <!--
      SOCIAL PREVIEWS
      =========================================================================
      These URLs are absolute on purpose. WhatsApp, LinkedIn and Facebook all
      ignore a relative og:image and fall back to a bare text card — and given
      how much of this business arrives as a link pasted into WhatsApp, that
      preview is doing real work.

      If a custom domain is added later, update the four absolute URLs here
      (og:image, og:url, twitter:image, canonical), the Sitemap line in
      robots.txt, and public/sitemap.xml.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akhari" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Akhari — AI Automation Studio" />
    <meta
      property="og:description"
      content="Build systems, not repetitive tasks. AI automation, voice agents and live dashboards for businesses in Hyderabad."
    />
    <meta property="og:image" content="https://akhari.vercel.app/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Akhari — build systems, not repetitive tasks." />
    <meta property="og:url" content="https://akhari.vercel.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akhari — AI Automation Studio" />
    <meta
      name="twitter:description"
      content="Build systems, not repetitive tasks. AI automation, voice agents and live dashboards for businesses in Hyderabad."
    />
    <meta name="twitter:image" content="https://akhari.vercel.app/brand/og.png" />

    <link rel="canonical" href="https://akhari.vercel.app/" />

    <link rel="icon" href="/brand/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/logo-mark-sm.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Instrument Serif is display-only: headlines and nothing else. It ships a
      single weight, which is the point — it is a face for large sizes, not a
      family to set a page in. Inter still carries body copy and JetBrains Mono
      the technical labels.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
