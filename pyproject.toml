[project]
name = "akhari"
version = "0.1.0"
description = "WAT framework: workflows (SOPs), agents (orchestration), tools (execution)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
